index index.html;
server_tokens off;

# includeSubDomains covers every homelab subdomain under mercantus.ch too;
# they are all https-only behind Cloudflare, so that is fine.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
    try_files $uri $uri/ =404;
    expires -1;   # HTML always revalidates
}

# `expires` instead of add_header Cache-Control on purpose: an add_header inside a
# location would discard the security headers inherited from above.
location ~* \.(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf)$ {
    expires 1y;
    access_log off;
}
