gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name mercantus.ch;
    root /usr/share/nginx/html/ch;
    include /etc/nginx/site-common.conf;
}

server {
    listen 80;
    server_name mercantus.mx www.mercantus.mx;
    root /usr/share/nginx/html/mx;
    include /etc/nginx/site-common.conf;
}

# Any other Host header is dropped instead of falling through to the ch site.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
