# https://docs.paperless-ngx.com/
# Upstream reference: docker/compose/docker-compose.postgres-tika.yml
#
# Tags are pinned and there is deliberately no watchtower label here. Paperless
# runs irreversible schema migrations on upgrade - 3.0.2 existed only to repair
# one broken in 3.0.1 - so an unattended monday-morning pull is not something a
# document archive should be exposed to. Watchtower runs with
# WATCHTOWER_LABEL_ENABLE=true, so omitting the label is enough.
# To upgrade: read the release notes, bump the tag, "manage.py update paperless".

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.4
    container_name: paperless
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      # search index and classifier model: rebuildable but latency-sensitive
      - ${DOCKERDIR}/paperless/data:/usr/src/paperless/data
      # the documents themselves: irreplaceable and bulky
      - ${DATADIR}/paperless/media:/usr/src/paperless/media
      - ${DATADIR}/paperless/consume:/usr/src/paperless/consume
      - ${DATADIR}/paperless/export:/usr/src/paperless/export
    environment:
      # paperless's init recursively chowns data/media/consume/export to this
      # uid:gid on every start, so those directories end up owned 1000:1000 -
      # www-data (uid 33, what nextcloud/jellyfin/arr-stack run as here) cannot
      # drop files into consume. Fine for this standalone drop-folder setup;
      # revisit if consume is ever pointed at a Nextcloud folder.
      - USERMAP_UID=${PUID:-1000}
      - USERMAP_GID=${PGID:-1000}
      - PAPERLESS_TIME_ZONE=${TZ}
      # required since 3.0 - the container refuses to start without it
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      # sets ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS and CORS_ALLOWED_HOSTS at once
      - PAPERLESS_URL=https://paperless.${HOST_DOMAIN}
      # allauth rate-limits logins per client IP. Behind traefik every request
      # otherwise carries the same container IP, so a few failed logins from one
      # client would lock out everyone. All traffic here is cloudflare-proxied
      # (see cloudflare_ddns, PROXIED=true).
      # Accepted residual risk: traefik also listens on the LAN, so a client
      # that reaches docker-1 directly (bypassing Cloudflare) can forge
      # CF-Connecting-IP and defeat the login rate limiting.
      - PAPERLESS_ALLAUTH_TRUSTED_CLIENT_IP_HEADER=CF-Connecting-IP
      # the image ships eng/deu/ita/spa/fra, so no extra langs to install
      - PAPERLESS_OCR_LANGUAGE=deu+eng+spa+fra
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=paperless_db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_REDIS=redis://paperless_broker:6379
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless_gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://paperless_tika:9998
      # applied only on first start, while no such superuser exists
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      # AI features (new in 3.0, opt-in): LLM suggestions, document chat and
      # similar-document retrieval, all against the local ollama sidecar -
      # no document content leaves the network. Both models must be pulled
      # once on deploy (see the ollama service below). Answers are fallible;
      # the documents stay authoritative.
      - PAPERLESS_AI_ENABLED=true
      - PAPERLESS_AI_LLM_BACKEND=ollama
      - PAPERLESS_AI_LLM_MODEL=gemma4:e4b
      - PAPERLESS_AI_LLM_ENDPOINT=http://paperless_ollama:11434
      # embeddings build the RAG/similarity index (rebuilt nightly at 02:10
      # by default); changing this model requires "document_llmindex rebuild"
      - PAPERLESS_AI_LLM_EMBEDDING_BACKEND=ollama
      - PAPERLESS_AI_LLM_EMBEDDING_MODEL=embeddinggemma
      # CPU inference: RAG-backed suggestions can exceed the 120s default
      - PAPERLESS_AI_LLM_REQUEST_TIMEOUT=300
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls.certresolver=cloudflare
      - traefik.http.routers.paperless.rule=Host(`paperless.${HOST_DOMAIN}`)
      - traefik.http.services.paperless.loadbalancer.server.scheme=http
      - traefik.http.services.paperless.loadbalancer.server.port=8000
    networks:
      - traefik-public
      - paperless_net
    # no healthcheck: the image ships its own against localhost:8000

  db:
    image: postgres:18
    container_name: paperless_db
    restart: unless-stopped
    volumes:
      # postgres:18 volumes /var/lib/postgresql, not /var/lib/postgresql/data
      # like the 17 image outline uses
      - ${DOCKERDIR}/paperless/db:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "paperless", "-U", "paperless"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - paperless_net

  broker:
    image: valkey/valkey:9-alpine
    container_name: paperless_broker
    restart: unless-stopped
    volumes:
      - ${DOCKERDIR}/paperless/redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3
    networks:
      - paperless_net

  gotenberg:
    image: gotenberg/gotenberg:8.34
    container_name: paperless_gotenberg
    restart: unless-stopped
    # chromium is what converts .eml - no javascript and no remote content, so
    # an email cannot phone home with a tracking pixel during conversion
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless_net

  tika:
    image: apache/tika:latest
    container_name: paperless_tika
    restart: unless-stopped
    networks:
      - paperless_net

  ollama:
    image: ollama/ollama:0.32.9
    container_name: paperless_ollama
    restart: unless-stopped
    # CPU-only inference (docker-1 has no GPU). The caps keep a long chat
    # answer from starving the other containers on this 16-core/32GB VM;
    # ollama unloads idle models after 5 min, so the RAM cost is transient.
    # No depends_on from paperless: it runs fine without the AI backend.
    # Models are pulled once, manually, on deploy:
    #   docker exec paperless_ollama ollama pull gemma4:e4b
    #   docker exec paperless_ollama ollama pull embeddinggemma
    cpus: 12
    mem_limit: 12g
    volumes:
      # pulled models: rebuildable (re-pull), but multi-GB - fast pool
      - ${DOCKERDIR}/paperless/ollama:/root/.ollama
    # paperless_net only - the API is unauthenticated, so it must stay
    # unreachable from outside the stack (no traefik-public, no ports)
    networks:
      - paperless_net

networks:
  traefik-public:
    external: true
  paperless_net: { }
