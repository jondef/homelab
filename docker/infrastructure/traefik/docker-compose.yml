
name: traefik

services:
  traefik:
    image: traefik:3.7
    container_name: traefik
    restart: unless-stopped
    networks:
      - traefik-public
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKERDIR}/traefik/logs:/var/log/traefik
      - ${DOCKERDIR}/traefik:/traefik
    command:
      - --log.level=ERROR  # set to INFO/ERROR for production, DEBUG for dev
      - --log.filePath=/var/log/traefik/traefik.log
      - --accessLog=true
      - --accessLog.format=json
      - --accessLog.fields.headers.names.X-Request-Id=keep
      - --accessLog.filePath=/var/log/traefik/access.log

      - --api.insecure=false  # allow without providing ssl certificate
      - --api.dashboard=true  # enable dashboard
      - --global.sendAnonymousUsage=false
      - --global.checkNewVersion=false
      - --providers.docker=true # enable docker as provider
      - --providers.docker.exposedbydefault=false  # do not expose every container, only those with labels
      - --providers.docker.network=traefik-public
      - --providers.file.directory=/traefik/dynamic  # file provider for external services
      - --providers.file.watch=true

      # Without this traefik treats the cloudflare edge as the client and overwrites
      # X-Forwarded-For with it, so every service behind here logs and rate-limits
      # cloudflare instead of the visitor. https://www.cloudflare.com/ips-v4 + ips-v6
      - --entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=${HOST_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${HOST_DOMAIN}
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=12h  # change default timeouts for long-running requests
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=12h  # this is needed for webdav clients that do not support the TUS protocol
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=3m  # Cloudflare has a 100s timeout

      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=0
      - --certificatesresolvers.cloudflare.acme.email=${CLOUDFLARE_DNS_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/traefik/acme.json
      # STAGING Let's Encrypt - comment out this line for production
      #- --certificatesresolvers.cloudflare.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=cloudflare
      - traefik.http.routers.traefik.rule=Host(`traefik.${HOST_DOMAIN}`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=authelia@docker # traefik-auth for basic auth
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: local

networks:
  traefik-public:
    name: traefik-public
