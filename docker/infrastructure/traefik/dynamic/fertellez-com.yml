# fertellez.com → VM 205 (homelab docs/fertellez-vm205.md; product repo deploy/README.md).
# Installed by copying to /mnt/appdata/traefik/dynamic/ on docker-1; the file provider watches the folder.
# The only fertellez route: fertellez.mercantus.ch was removed on 2026-11-16 (its fertellez.yml held the
# fertellez-web service until then; the two files must never be in the folder together, or Traefik sees the service
# twice and drops it).
# The certificate comes from a DNS-01 challenge written straight into the fertellez.com zone in Cloudflare, so
# CLOUDFLARE_DNS_API_TOKEN must reach that zone (Zone Read, DNS Edit). Traefik retries a failed challenge only on
# the next configuration change.
# No noindex middleware: the app sends its own X-Robots-Tag while SEARCH_INDEXING=block.
http:
  routers:
    fertellez-com:
      rule: "Host(`fertellez.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: fertellez.com
            sans:
              - www.fertellez.com
      service: fertellez-web

    fertellez-com-www:
      rule: "Host(`www.fertellez.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: fertellez.com
            sans:
              - www.fertellez.com
      middlewares:
        - fertellez-com-www-to-apex
      service: fertellez-web

  middlewares:
    fertellez-com-www-to-apex:
      redirectRegex:
        regex: "^https://www\\.fertellez\\.com/(.*)"
        replacement: "https://fertellez.com/${1}"
        permanent: true

  services:
    fertellez-web:
      loadBalancer:
        servers:
          # Next.js server of the product's web image; it proxies /api to the api container itself.
          - url: "http://192.168.1.105:3000"
