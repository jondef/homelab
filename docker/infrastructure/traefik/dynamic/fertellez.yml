# fertellez staging on VM 205 (homelab docs/fertellez-vm205.md; product repo deploy/README.md).
# Installed by copying to /mnt/appdata/traefik/dynamic/ on docker-1; the file provider watches the folder.
# Public (no Authelia: the site has no login and only placeholder copy) but kept out of search engines
# until fertellez.mx goes live.
http:
  routers:
    fertellez:
      rule: "Host(`fertellez.mercantus.ch`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - fertellez-noindex
      service: fertellez-web

  middlewares:
    fertellez-noindex:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow, noarchive"

  services:
    fertellez-web:
      loadBalancer:
        servers:
          # Next.js server of the product's web image; it proxies /api to the api container itself.
          - url: "http://192.168.1.105:3000"
