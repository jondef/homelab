# Velacasa staging on VM 204 (homelab docs/velacasa-staging-vm204.md, product ADR-0013).
# Installed by copying to /mnt/appdata/traefik/dynamic/ on docker-1; the file provider watches the folder.
http:
  routers:
    velacasa:
      rule: "Host(`velacasa.app`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: velacasa.app
            sans:
              - www.velacasa.app
              - auth.velacasa.app
      middlewares:
        - velacasa-auth          # Authelia gate: the staging accepts the fixed login code, so only Authelia users get in
      service: velacasa-web

    velacasa-www:
      rule: "Host(`www.velacasa.app`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: velacasa.app
            sans:
              - www.velacasa.app
              - auth.velacasa.app
      middlewares:
        - velacasa-to-apex
      service: velacasa-web

    velacasa-auth-portal:
      # Authelia's login page under the protected domain, so its session cookie reaches velacasa.app
      # (configuration.yml: session.cookies entry for velacasa.app).
      rule: "Host(`auth.velacasa.app`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: velacasa.app
            sans:
              - www.velacasa.app
              - auth.velacasa.app
      service: authelia-portal

  middlewares:
    velacasa-auth:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

    velacasa-to-apex:
      redirectRegex:
        regex: "^https://www\\.velacasa\\.app/(.*)"
        replacement: "https://velacasa.app/${1}"
        permanent: true

  services:
    authelia-portal:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"

    velacasa-web:
      loadBalancer:
        servers:
          # nginx of the product's web image; it proxies /api to the api container itself.
          - url: "http://192.168.1.104:8080"
