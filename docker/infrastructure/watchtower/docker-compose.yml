
services:
  watchtower:
    # containrrr/watchtower was archived 2025-12-17. Its image links a docker
    # client that only speaks API 1.25, and docker >= 29 requires 1.40+, so it
    # cannot talk to the daemon at all. nickfedor/watchtower is the maintained,
    # API-compatible fork - same labels and env vars.
    image: nickfedor/watchtower:1.20
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_MONITOR_ONLY=false
      - WATCHTOWER_SCHEDULE=0 0 4 * * MON
      - WATCHTOWER_LIFECYCLE_HOOKS=True
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=telegram://${TELEGRAM_BOT_TOKEN}@telegram/?channels=${TELEGRAM_CHAT_ID}
    labels:
      - com.centurylinklabs.watchtower.enable=true

